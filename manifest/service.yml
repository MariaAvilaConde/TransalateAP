apiVersion: v1
kind: Service
metadata:
  name: microservice-service
  namespace: maria
spec:
  type: NodePort  # Expone el puerto a través de un nodo del clúster
  ports:
    - port: 80          # Puerto interno del servicio (acceso desde el clúster)
      targetPort: 8086   # Puerto donde escucha tu contenedor (en el Pod)
      nodePort: 30001    # Puerto expuesto desde fuera del clúster (acceso externo)
  selector:
    app: microservice  # Coincide con los labels del Deployment/Pod