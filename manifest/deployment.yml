apiVersion: apps/v1
kind: Deployment
metadata:
  name: copichat-deployment
  namespace: copichat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: copichat
  template:
    metadata:
      labels:
        app: copichat
    spec:
      containers:
        - name: copichat-container
          image: marianayeli/copichat:latest
          ports:
            - containerPort: 8086
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: copichat-secret
                  key: database_url
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: copichat-secret
                  key: database_username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: copichat-secret
                  key: database_password
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: copichat-secret
                  key: port
